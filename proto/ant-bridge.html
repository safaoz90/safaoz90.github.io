<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ant Bridge</title>
<style>
  :root { --ink: #3b2a1c; --soft: #7a6450; }
  html, body { margin: 0; height: 100%; background: #f6e7c8; color: var(--ink);
    font: 600 16px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", sans-serif; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; touch-action: none; }
  header { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 16px 4px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--soft); font-size: 13px; font-weight: 500; }
  .sub b { color: var(--ink); }
  button { border: 0; background: #fff; color: var(--ink); font: inherit; border-radius: 14px; padding: 9px 14px; box-shadow: 0 2px 0 #d8bf92; }
  button:active { transform: translateY(2px); box-shadow: none; }
  button.on { background: #e0603c; color: #fff; box-shadow: 0 2px 0 #a8401f; }
  canvas { display: block; touch-action: none; border-radius: 22px; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
  .msg { min-height: 40px; max-width: 380px; text-align: center; color: var(--soft); font-size: 14px; font-weight: 500; padding: 6px 16px 0; }
  .msg b { color: var(--ink); }
  .win { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(59,42,28,.25); }
  .win.on { display: flex; }
  .card { background: #fff; border-radius: 24px; padding: 24px 28px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.2); max-width: 300px; }
  .card h2 { margin: 0 0 6px; font-size: 26px; }
  .card p { margin: 0 0 16px; color: var(--soft); font-weight: 500; }
  .card button { background: #e0603c; color: #fff; box-shadow: 0 3px 0 #a8401f; padding: 12px 22px; }
</style>
</head>
<body>
<header>
  <div><h1>Ant Bridge</h1><div class="sub" id="sub"></div></div>
  <button id="reset">Restart</button>
</header>
<canvas id="c"></canvas>
<div class="msg" id="msg"></div>
<div class="bar"><button id="l1">Level 1</button><button id="l2">Level 2 · hard</button></div>
<div class="win" id="win"><div class="card"><h2 id="winH"></h2><p id="winTxt"></p><button id="again">Play again</button></div></div>
<script>
(() => {
  // ================================================================ levels (logical 390 × 600, side view)
  // nodes: named points · walk: free ground between nodes · links: spots where ants can build (cost = ants)
  // foods: what must be carried home, and how many ants it needs.
  const LEVELS = [
    {
      name: 'Level 1', total: 14,
      intro: 'Tap a <b>dashed spot</b> to send ants to build. Then tap the <b>food</b> to send the free ants for it.',
      nodes: { nest: [48, 250], cliff: [112, 250], isl: [152, 250], islTop: [196, 250], islLow: [240, 372], gnd: [300, 372], berry: [338, 372] },
      walk: [['nest', 'cliff'], ['isl', 'islTop'], ['islTop', 'islLow'], ['gnd', 'berry']],
      links: [
        { id: 'a', a: 'cliff', b: 'isl', cost: 2 },
        { id: 'b', a: 'islLow', b: 'gnd', cost: 3 },
        { id: 'c', a: 'cliff', b: 'gnd', cost: 9, ctrl: [210, 165] },
      ],
      foods: [{ at: 'berry', need: 6, kind: 'berry' }],
      land: [[[0, 250], [112, 250], [118, 300], [108, 600], [0, 600]], [[152, 250], [196, 250], [240, 372], [236, 600], [150, 600], [146, 300]], [[300, 372], [390, 372], [390, 600], [306, 600], [296, 420]]],
      grass: [[0, 250, 112, 250], [152, 250, 196, 250], [196, 250, 240, 372], [300, 372, 390, 372]],
    },
    {
      name: 'Level 2', total: 11,
      intro: 'Two foods, <b>11 ants</b>. You can\'t build every bridge at once… but ants that bring food home are free again.',
      nodes: { nest: [40, 230], cliffE: [100, 230], p1L: [150, 230], p1R: [232, 230], p2L: [300, 230], cookie: [350, 230], vF: [104, 410], vD: [232, 410], berry: [276, 410] },
      walk: [['nest', 'cliffE'], ['p1L', 'p1R'], ['p2L', 'cookie'], ['vF', 'vD'], ['vD', 'berry']],
      links: [
        { id: 'a', a: 'cliffE', b: 'p1L', cost: 3 },
        { id: 'b', a: 'p1R', b: 'p2L', cost: 3 },
        { id: 'c', a: 'cliffE', b: 'p2L', cost: 8, ctrl: [200, 120] },
        { id: 'd', a: 'p1R', b: 'vD', cost: 4, ladder: true },
        { id: 'f', a: 'cliffE', b: 'vF', cost: 6, ladder: true },
      ],
      foods: [{ at: 'cookie', need: 4, kind: 'cookie' }, { at: 'berry', need: 5, kind: 'berry' }],
      land: [[[0, 230], [100, 230], [100, 600], [0, 600]], [[100, 410], [300, 410], [300, 600], [100, 600]], [[300, 230], [390, 230], [390, 600], [300, 600]]],
      float: [[150, 230, 232, 270]], // a floating island: x1, top, x2, bottom
      grass: [[0, 230, 100, 230], [150, 230, 232, 230], [300, 230, 390, 230], [100, 410, 300, 410]],
    },
  ];

  const cv = document.getElementById('c'), g = cv.getContext('2d'), VW = 390, VH = 600;
  let k = 1, dpr = 1, L, N, ants, links, foods, phase, active, done, rebuilt;

  function layout() {
    dpr = Math.min(3, window.devicePixelRatio || 1);
    const maxW = Math.min(window.innerWidth, 480) - 16, maxH = window.innerHeight - 200;
    k = Math.min(maxW / VW, maxH / VH);
    cv.style.width = VW * k + 'px'; cv.style.height = VH * k + 'px'; cv.width = VW * k * dpr; cv.height = VH * k * dpr;
  }

  function load(i) {
    L = LEVELS[i]; N = L.nodes; level = i;
    document.getElementById('l1').classList.toggle('on', i === 0); document.getElementById('l2').classList.toggle('on', i === 1);
    links = L.links.map((l) => ({ ...l, ants: [], ready: false, from: null }));
    ants = Array.from({ length: L.total }, (_, j) => ({ i: j, x: 14 + Math.random() * (N.cliff || N.cliffE)[0] * 0.75, y: N.nest[1], ang: 0, dir: Math.random() < 0.5 ? -1 : 1, state: 'home', path: null, step: 0, wait: Math.random() * 1.5, gait: Math.random() * 6 }));
    foods = L.foods.map((f) => ({ ...f, x: N[f.at][0], y: N[f.at][1], lift: 0, wob: 0, home: false, scale: 1, crew: null }));
    phase = 'build'; active = null; done = false; rebuilt = 0; upd(); say(L.intro);
    document.getElementById('win').classList.remove('on');
  }
  let level = 0;
  const say = (h) => { document.getElementById('msg').innerHTML = h; };
  const free = () => ants.filter((a) => a.state === 'home').length;
  const upd = () => {
    const f = foods.filter((x) => !x.home).map((x) => `${x.kind === 'berry' ? '🍓' : '🍪'} needs <b>${x.need}</b>`).join(' · ');
    document.getElementById('sub').innerHTML = `${L.name} · <b>${free()}</b> of ${L.total} ants free${f ? ' · ' + f : ''}`;
  };

  // ================================================================ geometry & paths
  function lp(l, t, from) { // a point on a link at t, measured from end `from`
    if (from && from === l.b) t = 1 - t;
    const A = N[l.a], B = N[l.b], C = l.ctrl;
    if (!C) return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t];
    const u = 1 - t; return [u * u * A[0] + 2 * u * t * C[0] + t * t * B[0], u * u * A[1] + 2 * u * t * C[1] + t * t * B[1]];
  }
  // walkers go on top of a bridge, or on the outside of a ladder
  const ride = (l) => (l.ladder ? [7, 0] : [0, -7]);
  function graph() {
    const adj = {}; const add = (a, b, link) => { (adj[a] = adj[a] || []).push({ to: b, link }); (adj[b] = adj[b] || []).push({ to: a, link }); };
    L.walk.forEach(([a, b]) => add(a, b, null)); links.forEach((l) => l.ready && add(l.a, l.b, l)); return adj;
  }
  function route(from, to) {
    const adj = graph(), prev = { [from]: null }, q = [from];
    while (q.length) { const n = q.shift(); if (n === to) break; for (const e of adj[n] || []) if (!(e.to in prev)) { prev[e.to] = { n, link: e.link }; q.push(e.to); } }
    if (!(to in prev)) return null;
    const nodes = []; for (let n = to; ; n = prev[n].n) { nodes.unshift({ n, link: prev[n] && prev[n].link }); if (!prev[n]) break; }
    const pts = [];
    nodes.forEach((s, i) => { const p = N[s.n]; if (s.link) { const o = ride(s.link); for (let j = 0; j <= 10; j++) { const q = lp(s.link, j / 10, nodes[i - 1].n); pts.push([q[0] + o[0], q[1] + o[1]]); } } pts.push([p[0], p[1]]); });
    return pts;
  }
  const reach = (n) => !!route('nest', n);

  // ================================================================ taps
  const linkHit = (x, y) => { let best = null, bd = 24; for (const l of links) for (let j = 1; j < 20; j++) { const q = lp(l, j / 20), d = Math.hypot(q[0] - x, q[1] - y); if (d < bd) { bd = d; best = l; } } return best; };
  cv.addEventListener('pointerdown', (e) => {
    if (phase !== 'build' || done) return;
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / k, y = (e.clientY - r.top) / k;
    const f = foods.find((f) => !f.home && Math.hypot(f.x - x, f.y - 14 - y) < 30);
    if (f) return send(f);
    const l = linkHit(x, y); if (!l) return;
    if (l.ants.length) return takeApart(l);
    build(l);
  });

  function build(l) {
    const from = reach(l.a) ? l.a : reach(l.b) ? l.b : null;
    if (!from) { l.shake = 1; return say(`The ants can't get there yet. Build something that <b>reaches</b> it first.`); }
    const home = ants.filter((a) => a.state === 'home');
    if (home.length < l.cost) { l.shake = 1; return say(`This needs <b>${l.cost}</b> ants, only <b>${home.length}</b> are free. Tap a bridge to take it apart and free its ants.`); }
    l.from = from; const A = N[from];
    home.sort((p, q) => Math.abs(p.x - A[0]) - Math.abs(q.x - A[0])).slice(0, l.cost).forEach((a, j) => {
      const t = (j + 0.5) / l.cost, slot = lp(l, t, from), q1 = lp(l, Math.min(1, t + 0.02), from), q0 = lp(l, Math.max(0, t - 0.02), from);
      a.slotAng = Math.atan2(q1[1] - q0[1], q1[0] - q0[0]);
      a.state = 'toLink'; a.link = l; a.path = [[a.x, a.y], ...route('nest', from).slice(1), slot]; a.step = 0; a.wait = j * 0.15; l.ants.push(a);
    });
    upd(); say(l.ladder ? 'The ants hold on to each other and climb down…' : 'Building…');
  }
  function takeApart(l) {
    if (!l.ready || busy()) return say('Wait a moment, the ants are still busy.');
    l.ready = false; // the ants step off and walk home from whichever end still connects to the nest
    const end = route(l.a, 'nest') ? l.a : route(l.b, 'nest') ? l.b : null;
    const stranded = links.some((o) => o !== l && o.ants.length && !reach(o.a) && !reach(o.b));
    if (!end || stranded) { l.ready = true; l.shake = 1; return say('Other ants would be <b>stranded</b>! Take apart the bridges further from the nest first.'); }
    const back = route(end, 'nest');
    l.ants.forEach((a, j) => { a.state = 'goHome'; a.path = [N[end], ...back.slice(1), [14 + Math.random() * 60, N.nest[1]]]; a.step = 0; a.wait = j * 0.1; a.link = null; });
    l.ants = []; rebuilt++; say('Taken apart. Those ants are free again.');
  }
  const busy = () => ants.some((a) => ['toLink', 'goHome', 'retreat'].includes(a.state));
  function send(f) {
    if (busy()) return say('Wait a moment, the ants are still busy.');
    const p = route('nest', f.at); if (!p) { f.wob = 0.6; return say(`No way to the ${f.kind === 'berry' ? 'strawberry' : 'cookie'} yet. Connect it to the nest.`); }
    const crew = ants.filter((a) => a.state === 'home'); if (!crew.length) return;
    phase = 'march'; active = f; f.crew = crew;
    crew.sort((p, q) => q.x - p.x).forEach((a, j) => { a.state = 'march'; a.path = [[a.x, a.y], ...p.slice(1)]; a.step = 0; a.wait = j * 0.2; a.slotX = (j - crew.length / 2) * 8; });
    say(`${crew.length} ants march out…`); upd();
  }
  document.getElementById('reset').onclick = () => load(level);
  document.getElementById('again').onclick = () => load(level === 0 ? 1 : level);
  document.getElementById('l1').onclick = () => load(0);
  document.getElementById('l2').onclick = () => load(1);

  // ================================================================ update
  const SPEED = 95;
  function walk(a, dt, speed = SPEED) {
    if (a.wait > 0) { a.wait -= dt; return false; }
    const tgt = a.path[a.step]; if (!tgt) return true;
    const dx = tgt[0] - a.x, dy = tgt[1] - a.y, d = Math.hypot(dx, dy), s = speed * dt;
    if (d < 0.5) { a.step++; return a.step >= a.path.length; }
    const m = Math.min(1, s / d); a.x += dx * m; a.y += dy * m; a.gait += s * 0.55;
    if (Math.abs(dx) > 0.3) a.dir = Math.sign(dx);
    const want = Math.atan2(dy, Math.abs(dx)) * a.dir; a.ang += (want - a.ang) * Math.min(1, dt * 12);
    return false;
  }
  function update(dt) {
    for (const a of ants) {
      if (a.state === 'home') {
        if (a.wait > 0) { a.wait -= dt; a.ang *= 0.9; continue; }
        if (!a.path || a.step >= a.path.length) { a.path = [[12 + Math.random() * ((N.cliff || N.cliffE)[0] - 30), N.nest[1]]]; a.step = 0; }
        if (walk(a, dt, 26)) { a.wait = 0.4 + Math.random() * 1.8; a.path = null; }
      } else if (a.state === 'toLink') {
        if (walk(a, dt)) {
          a.state = 'bridge'; const l = a.link;
          a.dir = Math.cos(a.slotAng) >= -0.01 ? 1 : -1; a.ang = a.dir > 0 ? a.slotAng : Math.atan2(-Math.sin(a.slotAng), -Math.cos(a.slotAng));
          if (l.ants.every((q) => q.state === 'bridge')) { l.ready = true; say(`Ready! <b>${free()}</b> ants are still free.`); }
        }
      } else if (a.state === 'goHome' || a.state === 'retreat') {
        if (walk(a, dt)) { a.state = 'home'; a.wait = 0.3; a.ang = 0; a.path = null; upd(); }
      } else if (a.state === 'march') {
        if (walk(a, dt)) { a.state = 'atFood'; }
      } else if (a.state === 'carry') {
        if (walk(a, dt, 55)) a.state = 'carried';
      }
    }
    if (phase === 'march') {
      const f = active, crew = f.crew;
      if (crew.every((a) => a.state === 'atFood')) {
        if (crew.length >= f.need) {
          phase = 'carry'; say('Heave-ho!');
          const back = route(f.at, 'nest');
          crew.forEach((a) => { a.state = 'carry'; a.path = [[a.x + a.slotX * 0.3, a.y], ...back.slice(1), [N.nest[0] + a.slotX * 0.6, N.nest[1]]]; a.step = 0; a.wait = 0.4; });
        } else {
          phase = 'strain'; f.wob = 1.6;
          say(`Too heavy! <b>${crew.length}</b> ants can't lift it, it needs <b>${f.need}</b>.`);
          setTimeout(() => { const back = route(f.at, 'nest'); crew.forEach((a, j) => { a.state = 'retreat'; a.path = [...back, [14 + Math.random() * 60, N.nest[1]]]; a.step = 0; a.wait = j * 0.12; }); phase = 'build'; active = null; }, 1700);
        }
      }
    }
    if (phase === 'carry') {
      const f = active, c = f.crew;
      const mx = c.reduce((s, a) => s + a.x, 0) / c.length, my = c.reduce((s, a) => s + a.y, 0) / c.length;
      f.lift = Math.min(1, f.lift + dt * 2); f.x += (mx - f.x) * Math.min(1, dt * 8); f.y += (my - f.y) * Math.min(1, dt * 8);
      if (c.every((a) => a.state === 'carried')) { phase = 'stow'; f.sink = 0; }
    }
    if (phase === 'stow') {
      const f = active; f.sink += dt; f.scale = Math.max(0, 1 - f.sink * 1.4);
      if (f.sink > 0.8) {
        f.home = true; burst(N.nest[0], N.nest[1] - 18);
        f.crew.forEach((a) => { a.state = 'home'; a.path = null; a.wait = Math.random() * 0.6; });
        phase = 'build'; active = null; upd();
        if (foods.every((x) => x.home)) win(); else say('Home! Those ants are <b>free again</b>. What about the other food?');
      }
    }
    foods.forEach((f) => { if (f.wob > 0) f.wob -= dt; });
    links.forEach((l) => { if (l.shake) l.shake = Math.max(0, l.shake - dt * 2.5); });
  }
  function win() {
    done = true;
    document.getElementById('winH').textContent = level === 0 ? 'Strawberry home! 🍓' : 'Pantry full! 🍓🍪';
    document.getElementById('winTxt').textContent = level === 0 ? 'Short bridges leave more ants to carry.' : rebuilt ? `You took ${rebuilt} bridge${rebuilt > 1 ? 's' : ''} apart and rebuilt. That's the trick!` : 'Nice planning!';
    setTimeout(() => document.getElementById('win').classList.add('on'), 700);
  }

  // ================================================================ drawing
  function drawBg(now) {
    const sky = g.createLinearGradient(0, 0, 0, VH); sky.addColorStop(0, '#bfe3f3'); sky.addColorStop(0.55, '#f8e9c9'); sky.addColorStop(1, '#f1d6a4');
    g.fillStyle = sky; g.fillRect(0, 0, VW, VH);
    g.fillStyle = 'rgba(255,240,180,.8)'; g.beginPath(); g.arc(310, 80, 30, 0, 7); g.fill();
    g.fillStyle = '#c9dfae'; g.beginPath(); g.moveTo(0, 190); for (let x = 0; x <= VW; x += 10) g.lineTo(x, 165 + Math.sin(x / 55) * 18); g.lineTo(VW, VH); g.lineTo(0, VH); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)'; [[60, 60, 1], [230, 40, 0.8]].forEach(([x, y, s], i) => { const cx = ((x + now * 0.006 * (i + 1)) % (VW + 120)) - 60; g.beginPath(); g.arc(cx, y, 16 * s, 0, 7); g.arc(cx + 18 * s, y - 8 * s, 20 * s, 0, 7); g.arc(cx + 40 * s, y, 15 * s, 0, 7); g.fill(); });
    const ch = g.createLinearGradient(0, 240, 0, VH); ch.addColorStop(0, 'rgba(90,60,40,0)'); ch.addColorStop(1, 'rgba(60,38,24,.55)'); g.fillStyle = ch; g.fillRect(0, 240, VW, VH);
  }
  function dirtFill() { const gr = g.createLinearGradient(0, 220, 0, VH); gr.addColorStop(0, '#b07a4c'); gr.addColorStop(1, '#6e4528'); return gr; }
  function pebbles() { g.save(); g.clip(); g.fillStyle = 'rgba(255,230,190,.18)'; for (let i = 0; i < 46; i++) { const x = (i * 73) % VW, y = 240 + ((i * 137) % 360); g.beginPath(); g.ellipse(x, y, 4 + (i % 3) * 2, 3, 0, 0, 7); g.fill(); } g.restore(); }
  function grass(x1, y1, x2, y2) {
    g.strokeStyle = '#6aa84f'; g.lineWidth = 7; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1 + 2); g.lineTo(x2, y2 + 2); g.stroke();
    g.strokeStyle = '#86c06a'; g.lineWidth = 2;
    const len = Math.hypot(x2 - x1, y2 - y1); for (let d = 4; d < len; d += 7) { const t = d / len, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.sin(d) * 2, y - 5 - (d % 3)); g.stroke(); }
  }
  function drawTerrain() {
    for (const poly of L.land) { g.fillStyle = dirtFill(); g.beginPath(); poly.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill(); pebbles(); }
    for (const [x1, top, x2, bot] of L.float || []) { // floating island with dangling roots
      g.fillStyle = dirtFill(); g.beginPath(); g.moveTo(x1, top); g.lineTo(x2, top); g.quadraticCurveTo(x2, bot, (x1 + x2) / 2, bot + 18); g.quadraticCurveTo(x1, bot, x1, top); g.fill();
      g.strokeStyle = '#7a5232'; g.lineWidth = 1.5; for (let x = x1 + 14; x < x2 - 10; x += 16) { g.beginPath(); g.moveTo(x, bot); g.quadraticCurveTo(x + 4, bot + 16, x - 2, bot + 26); g.stroke(); }
    }
    L.grass.forEach((s) => grass(...s));
    g.fillStyle = '#9a6a42'; g.beginPath(); g.ellipse(N.nest[0], N.nest[1] + 2, 28, 15, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#3a2416'; g.beginPath(); g.ellipse(N.nest[0], N.nest[1] - 2, 9, 6, 0, Math.PI, 0); g.fill();
    // stored food peeking out of the nest
    foods.filter((f) => f.home).forEach((f, i) => { g.font = '14px sans-serif'; g.textAlign = 'center'; g.fillText(f.kind === 'berry' ? '🍓' : '🍪', N.nest[0] - 8 + i * 16, N.nest[1] - 16); });
  }
  function linkPath(l, off) { g.beginPath(); for (let j = 0; j <= 24; j++) { const q = lp(l, j / 24); j ? g.lineTo(q[0] + off[0], q[1] + off[1]) : g.moveTo(q[0] + off[0], q[1] + off[1]); } }
  function drawSpots(now) {
    for (const l of links) {
      if (l.ants.length) continue;
      const sh = Math.sin((l.shake || 0) * 30) * 4 * (l.shake || 0);
      g.save(); g.translate(sh, 0);
      g.setLineDash([6, 6]); g.lineDashOffset = -now * 0.02; g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 4; g.lineCap = 'round';
      linkPath(l, l.ladder ? [4, 0] : [0, -4]); g.stroke(); g.setLineDash([]);
      const M = lp(l, 0.5), mx = M[0] + (l.ladder ? 26 : 0), my = M[1] - (l.ladder ? 0 : 22), pulse = 1 + Math.sin(now / 300 + l.cost) * 0.05;
      g.translate(mx, my); g.scale(pulse, pulse);
      g.fillStyle = '#fff'; g.beginPath(); g.roundRect(-20, -12, 40, 24, 12); g.fill();
      g.fillStyle = '#3b2a1c'; g.font = '700 14px -apple-system, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🐜' + l.cost, 0, 1);
      g.restore();
    }
  }
  function drawFood(f, now) {
    if (f.home || f.scale <= 0) return;
    const wob = f.wob > 0 ? Math.sin(now / 40) * 0.08 : 0, lift = f.lift * 12;
    g.save(); g.translate(f.x, f.y - 15 - lift); g.rotate(wob); g.scale(f.scale, f.scale);
    if (!f.lift) { g.fillStyle = 'rgba(60,30,20,.2)'; g.beginPath(); g.ellipse(0, 15, 18, 4, 0, 0, 7); g.fill(); }
    if (f.kind === 'berry') {
      const gr = g.createRadialGradient(-6, -6, 2, 0, 0, 22); gr.addColorStop(0, '#ff7a7a'); gr.addColorStop(1, '#d42b3a');
      g.fillStyle = gr; g.beginPath(); g.moveTo(0, 16); g.bezierCurveTo(-24, 6, -22, -16, 0, -14); g.bezierCurveTo(22, -16, 24, 6, 0, 16); g.fill();
      g.fillStyle = '#ffe58a'; for (let i = 0; i < 12; i++) { const a = i * 2.4, r = 4 + (i % 4) * 3; g.beginPath(); g.ellipse(Math.cos(a) * r, Math.sin(a) * r * 0.8 - 1, 1.2, 1.8, a, 0, 7); g.fill(); }
      g.fillStyle = '#4f9a3a'; for (let i = -2; i <= 2; i++) { g.beginPath(); g.ellipse(i * 5, -15, 3, 7, i * 0.5, 0, 7); g.fill(); }
    } else {
      const gr = g.createRadialGradient(-5, -6, 2, 0, 0, 20); gr.addColorStop(0, '#f2c27a'); gr.addColorStop(1, '#c98a3e');
      g.fillStyle = gr; g.beginPath(); g.ellipse(0, 2, 19, 13, 0, 0, 7); g.fill();
      g.fillStyle = '#5a3418'; [[-8, -2], [4, -5], [9, 4], [-3, 6], [-11, 6], [12, -3]].forEach(([x, y]) => { g.beginPath(); g.ellipse(x, y, 2.6, 2, 0.4, 0, 7); g.fill(); });
    }
    // how many ants it needs, until it's on its way
    if (!f.lift) { g.fillStyle = '#fff'; g.beginPath(); g.roundRect(-17, -38, 34, 20, 10); g.fill(); g.fillStyle = '#3b2a1c'; g.font = '700 12px -apple-system, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🐜' + f.need, 0, -27); }
    g.restore();
  }
  // a side-view ant: abdomen, thorax, head, 6 legs in a tripod gait, antennae, a shiny eye
  function drawAnt(a, now) {
    const still = a.state === 'bridge', s = 1.15;
    g.save(); g.translate(a.x, a.y - (still ? 3 : 5)); g.rotate(a.ang); g.scale(a.dir * s, s);
    const ph = a.gait, lift = (o) => (still ? 0 : Math.max(0, Math.sin(ph + o)) * 2.2), swing = (o) => (still ? Math.sin(now / 500 + a.i) * 0.4 : Math.cos(ph + o) * 2.5);
    g.strokeStyle = '#2b1a12'; g.lineWidth = 1.3; g.lineCap = 'round';
    [[-4, 0], [0, Math.PI], [4, 0]].forEach(([bx, o]) => {
      [o, o + Math.PI].forEach((oo, side) => { g.globalAlpha = side ? 1 : 0.6; g.beginPath(); g.moveTo(bx * 0.6, 1); g.lineTo(bx + swing(oo) - 1, 3 - lift(oo)); g.lineTo(bx * 1.3 + swing(oo), 5.5 - lift(oo)); g.stroke(); });
    });
    g.globalAlpha = 1;
    const body = g.createLinearGradient(0, -5, 0, 3); body.addColorStop(0, '#8a4a2e'); body.addColorStop(1, '#4a2416');
    g.fillStyle = body;
    g.beginPath(); g.ellipse(-6.5, -1, 5.2, 3.8, -0.15, 0, 7); g.fill();
    g.beginPath(); g.ellipse(-0.5, -0.5, 2.6, 1.9, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(4.6, -1.6, 3.2, 2.9, 0.2, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,220,190,.55)'; g.beginPath(); g.ellipse(-7.5, -3, 2, 0.9, -0.2, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(5.6, -2.4, 1.15, 0, 7); g.fill(); g.fillStyle = '#111'; g.beginPath(); g.arc(5.9, -2.3, 0.7, 0, 7); g.fill();
    const tw = Math.sin(now / 160 + a.i) * 0.6;
    g.strokeStyle = '#2b1a12'; g.lineWidth = 0.9; g.beginPath(); g.moveTo(5.5, -4); g.quadraticCurveTo(7, -8 + tw, 10, -7.5 + tw); g.moveTo(4.5, -4.2); g.quadraticCurveTo(6, -8.5 - tw, 8.5, -9 - tw); g.stroke();
    g.restore();
  }
  const sparks = [];
  function burst(x, y) { for (let i = 0; i < 30; i++) { const a = Math.random() * 7, v = 40 + Math.random() * 90; sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 1, c: ['#ff6b6b', '#ffd166', '#6ac46a', '#fff'][i % 4] }); } }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    g.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
    drawBg(now); drawTerrain(); drawSpots(now);
    for (const l of links) if (l.ready) { g.strokeStyle = '#4a2416'; g.lineWidth = 3; linkPath(l, l.ladder ? [2, 0] : [0, -2]); g.stroke(); }
    ants.filter((a) => a.state === 'bridge').forEach((a) => drawAnt(a, now));
    foods.filter((f) => !f.lift).forEach((f) => drawFood(f, now));
    ants.filter((a) => a.state !== 'bridge').sort((p, q) => p.y - q.y).forEach((a) => drawAnt(a, now));
    foods.filter((f) => f.lift).forEach((f) => drawFood(f, now));
    for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.life -= dt; if (s.life <= 0) { sparks.splice(i, 1); continue; } s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 160 * dt; g.globalAlpha = s.life; g.fillStyle = s.c; g.beginPath(); g.arc(s.x, s.y, 2.5, 0, 7); g.fill(); g.globalAlpha = 1; }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', layout);
  layout(); load(/hard|2/.test(location.hash) ? 1 : 0); requestAnimationFrame(frame);
})();
</script>
